name: MarkdownNotes
options:
  bundleIdPrefix: com.mdnotes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
targets:
  MarkdownNotes:
    type: application
    platform: iOS
    sources:
      - path: MarkdownNotes
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdnotes.swift
        PRODUCT_NAME: MarkdownNotes
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Markdown Notes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
